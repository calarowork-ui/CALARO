global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: backend          # API traffic + CALARO product metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: caddy            # all site traffic, including page loads
    static_configs:
      - targets: ["caddy:2020"]

  - job_name: node             # the server: CPU, memory, disk, network
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
